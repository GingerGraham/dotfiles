- name: git | resolve projects_base path
  ansible.builtin.set_fact:
    projects_base_expanded: "{{ projects_base | replace('~', ansible_facts['env']['HOME']) }}"

# ── Config directories ────────────────────────────────────────────────────────

- name: git | ensure ~/.config/git/profiles exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/git/profiles"
    state: directory
    mode: '0700'

# ── Static config files ───────────────────────────────────────────────────────

- name: git | deploy global gitignore
  ansible.builtin.copy:
    src: ignore
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/git/ignore"
    mode: '0644'

- name: git | deploy global gitattributes
  ansible.builtin.copy:
    src: attributes
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/git/attributes"
    mode: '0644'

# ── ~/.gitconfig ──────────────────────────────────────────────────────────────
# Rendered on every run. Stable template — only global settings and two [include]
# lines. Does not contain any project-specific includeIf blocks.

- name: git | deploy ~/.gitconfig
  ansible.builtin.template:
    src: gitconfig.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/.gitconfig"
    mode: '0600'

# ── project-includes ──────────────────────────────────────────────────────────
# Rendered on every run from host_vars. The shell function git-add-project also
# updates this file and host_vars/localhost.yml, so they stay in sync.

- name: git | deploy project-includes
  ansible.builtin.template:
    src: project-includes.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/git/project-includes"
    mode: '0600'

# ── projects.yml manifest ─────────────────────────────────────────────────────
# Written ONCE from host_vars (force: no). The live source of truth thereafter.
# Updated by git-add-project / git-update-project / git-remove-project.
# Rebuild from host_vars: delete this file and re-run, or git-sync-projects --from-host-vars.

- name: git | write projects.yml manifest (first run only)
  ansible.builtin.template:
    src: projects.yml.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/git/projects.yml"
    mode: '0600'
    force: false

# ── Profile .inc files ────────────────────────────────────────────────────────
# Written ONCE per project (force: no). Managed live by git-update-project.
# The git config --file approach in the shell functions handles field-level
# updates without rewriting the whole file.

- name: git | deploy profile .inc files (first run only per project)
  ansible.builtin.template:
    src: profile.inc.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/git/profiles/{{ (item.context + '-' + item.provider) | lower | replace(' ', '-') }}.inc"
    mode: '0600'
    force: false
  loop: "{{ git_projects }}"
  loop_control:
    label: "{{ item.context }}/{{ item.provider }}"
  when: git_projects | length > 0

# ── local.inc ─────────────────────────────────────────────────────────────────
# Machine-local overrides: credential helpers, personal tokens, etc.
# Never managed by Ansible beyond initial creation.

- name: git | create local.inc if absent
  ansible.builtin.copy:
    content: |
      # Machine-local git config — never managed by Ansible.
      # Credential helpers, host-specific settings, etc. go here.
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/git/profiles/local.inc"
    mode: '0600'
    force: false

# ── Project directories ───────────────────────────────────────────────────────

- name: git | ensure projects base directory exists
  ansible.builtin.file:
    path: "{{ projects_base_expanded }}"
    state: directory
    mode: '0755'

- name: git | create project directories
  ansible.builtin.file:
    path: "{{ projects_base_expanded }}/{{ item.context }}/{{ item.provider }}"
    state: directory
    mode: '0755'
  loop: "{{ git_projects }}"
  loop_control:
    label: "{{ item.context }}/{{ item.provider }}"
  when: git_projects | length > 0

# ── CLI context (gh/glab) ──────────────────────────────────────────────────────
# Wires per-context gh/glab CLI config directories and generated .envrc files
# so authentication follows the working directory the same way identity
# already does via direnv. Runs after project directories exist (above), since
# the .envrc below is written inside them. See ansible/roles/git/README.md#cli-context.
#
# The direnv stdlib function (below) is deployed unconditionally, even when no
# project currently has `cli` set: it's inert until an .envrc calls `use
# git_context`, and deploying it only conditionally left a real gap — adding
# CLI wiring later via git-add-project-cli (or DOTFILES_REPO_DIR being unset
# briefly causing host_vars to go stale) could leave a .envrc calling a
# function that doesn't exist, silently falling back to the unscoped
# credential store. Only the per-project directories/.envrc/sentinel below
# stay conditional on git_cli_projects.

- name: git | cli | resolve projects with CLI wiring
  ansible.builtin.set_fact:
    git_cli_projects: "{{ git_projects | selectattr('cli', 'defined') | selectattr('cli') | list }}"
    git_non_cli_projects: "{{ (git_projects | rejectattr('cli', 'defined') | list) + (git_projects | selectattr('cli', 'defined') | rejectattr('cli') | list) }}"

- name: git | cli | ensure ~/.config/direnv/lib exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/direnv/lib"
    state: directory
    mode: '0700'

- name: git | cli | deploy direnv stdlib function
  ansible.builtin.template:
    src: dotfiles-git-context.sh.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/direnv/lib/dotfiles-git-context.sh"
    mode: '0644'
    force: true

- name: git | cli | ensure CLI config directories
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/git/{{ item.cli }}/{{ item.context | lower | replace(' ', '-') }}"
    state: directory
    mode: '0700'
  loop: "{{ git_cli_projects }}"
  loop_control:
    label: "{{ item.context }}/{{ item.provider }} ({{ item.cli }})"

- name: git | cli | preserve any pre-existing hand-written .envrc before overwrite
  ansible.builtin.shell:
    cmd: |
      set -e
      target="{{ projects_base_expanded }}/{{ item.context }}/{{ item.provider }}/.envrc"
      preserved="${target}.pre-dotfiles"
      marker='# Generated by the dotfiles git role'
      if [[ -f "${target}" ]] && [[ ! -f "${preserved}" ]] && ! head -n1 "${target}" | grep -qF "${marker}"; then
        cp -p "${target}" "${preserved}"
        echo "preserved"
      else
        echo "unchanged"
      fi
    executable: /bin/bash
  loop: "{{ git_cli_projects }}"
  loop_control:
    label: "{{ item.context }}/{{ item.provider }}"
  register: _git_cli_envrc_preserve
  changed_when: "'preserved' in stdout"

- name: git | cli | report preserved .envrc files
  ansible.builtin.debug:
    msg: >-
      Preserved your existing .envrc as
      {{ projects_base_expanded }}/{{ item.item.context }}/{{ item.item.provider }}/.envrc.pre-dotfiles
      before replacing it with the generated one. Compare and fold in anything you need — the
      CLI config store itself can be carried over with git-add-project-cli --adopt — then
      remove the .pre-dotfiles file.
  loop: "{{ _git_cli_envrc_preserve.results }}"
  loop_control:
    label: "{{ item.item.context }}/{{ item.item.provider }}"
  when: "'preserved' in item.stdout"

- name: git | cli | deploy generated .envrc per project
  ansible.builtin.template:
    src: envrc.j2
    dest: "{{ projects_base_expanded }}/{{ item.context }}/{{ item.provider }}/.envrc"
    mode: '0644'
    force: true
  loop: "{{ git_cli_projects }}"
  loop_control:
    label: "{{ item.context }}/{{ item.provider }}"

# Mirrors _git_regenerate_envrc's stale-cleanup on the shell side: a project
# that had `cli` removed from host_vars should lose its generated .envrc too,
# not keep pointing at a config dir nobody maintains any more. Marker-gated,
# same as the shell side — a hand-written .envrc is left alone.
- name: git | cli | remove stale .envrc for projects without CLI wiring
  ansible.builtin.shell:
    cmd: |
      set -e
      target="{{ projects_base_expanded }}/{{ item.context }}/{{ item.provider }}/.envrc"
      marker='# Generated by the dotfiles git role'
      if [[ -f "${target}" ]] && head -n1 "${target}" | grep -qF "${marker}"; then
        rm -f "${target}"
        echo "removed"
      else
        echo "unchanged"
      fi
    executable: /bin/bash
  loop: "{{ git_non_cli_projects }}"
  loop_control:
    label: "{{ item.context }}/{{ item.provider }}"
  register: _git_cli_stale_envrc
  changed_when: "'removed' in stdout"
  when: git_non_cli_projects | length > 0

- name: git | cli | ensure state directory exists
  ansible.builtin.file:
    path: "{{ xdg_state_home }}/dotfiles"
    state: directory
    mode: '0700'
  when: git_cli_projects | length > 0

- name: git | cli | create sentinel file (CLI contexts configured)
  ansible.builtin.file:
    path: "{{ xdg_state_home }}/dotfiles/git-cli-contexts"
    state: touch
    mode: '0644'
    modification_time: preserve
    access_time: preserve
  when: git_cli_projects | length > 0

- name: git | cli | remove sentinel file (no CLI contexts configured)
  ansible.builtin.file:
    path: "{{ xdg_state_home }}/dotfiles/git-cli-contexts"
    state: absent
  when: git_cli_projects | length == 0

# ── XDG Projects migration ────────────────────────────────────────────────────
# Only runs when projects_base is not ~/Development.
# Moves existing ~/Development contents into ~/Projects, then replaces
# ~/Development with a compatibility symlink.

- name: git | migration | check for legacy ~/Development directory
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/Development"
  register: legacy_dev_stat
  when:
    - dotfiles_profile != 'minimal'
    - projects_base_expanded != ansible_facts['env']['HOME'] + '/Development'

# Abort if the repo is inside ~/Development, since the move would break it and manual intervention is needed to fix paths.
- name: git | migration | abort if dotfiles repo is inside ~/Development
  ansible.builtin.fail:
    msg: >-
      The dotfiles repo is located inside ~/Development ({{ dotfiles_repo_root }}),
      which is the directory this migration would move. Re-clone the repo to
      {{ projects_base_expanded }}/Personal/GitHub/dotfiles and re-run from there.
  when:
    - dotfiles_profile != 'minimal'
    - projects_base_expanded != ansible_facts['env']['HOME'] + '/Development'
    - legacy_dev_stat is defined
    - legacy_dev_stat.stat.exists
    - legacy_dev_stat.stat.isdir
    - not legacy_dev_stat.stat.islnk
    - dotfiles_repo_root.startswith(ansible_facts['env']['HOME'] + '/Development')

- name: git | migration | move ~/Development contents to Projects
  ansible.builtin.shell:
    cmd: |
      set -e
      shopt -s dotglob nullglob

      merge_into() {
          local src="$1" dst="$2"
          local item name
          mkdir -p "${dst}"
          for item in "${src}"/*; do
              [[ -e "${item}" ]] || continue
              name="${item##*/}"
              if [[ -d "${item}" && -d "${dst}/${name}" ]]; then
                  merge_into "${item}" "${dst}/${name}"
                  rmdir "${item}" 2>/dev/null || true
              else
                  mv "${item}" "${dst}/"
              fi
          done
      }

      merge_into "{{ ansible_facts['env']['HOME'] }}/Development" "{{ projects_base_expanded }}"
    executable: /bin/bash
  when:
    - dotfiles_profile != 'minimal'
    - projects_base_expanded != ansible_facts['env']['HOME'] + '/Development'
    - legacy_dev_stat is defined
    - legacy_dev_stat.stat.exists
    - legacy_dev_stat.stat.isdir
    - not legacy_dev_stat.stat.islnk
  changed_when: true

- name: git | migration | remove now-empty ~/Development directory
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/Development"
    state: absent
  when:
    - dotfiles_profile != 'minimal'
    - projects_base_expanded != ansible_facts['env']['HOME'] + '/Development'
    - legacy_dev_stat is defined
    - legacy_dev_stat.stat.exists
    - legacy_dev_stat.stat.isdir
    - not legacy_dev_stat.stat.islnk

- name: git | migration | create ~/Development → Projects symlink
  ansible.builtin.file:
    src: "{{ projects_base_expanded }}"
    dest: "{{ ansible_facts['env']['HOME'] }}/Development"
    state: link
  when:
    - dotfiles_profile != 'minimal'
    - projects_base_expanded != ansible_facts['env']['HOME'] + '/Development'
    - legacy_dev_stat is defined
    - legacy_dev_stat.stat.exists
    - legacy_dev_stat.stat.isdir
    - not legacy_dev_stat.stat.islnk
